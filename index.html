<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GP Db Search Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl">GP</div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">GP Db Search API</h1>
                    <p class="text-xs text-gray-500">API Version 2.0</p>
                </div>
            </div>
            <!-- Health Status Indicator -->
            <div id="health-status" class="flex items-center space-x-2 bg-gray-100 px-3 py-1.5 rounded-full text-xs font-medium text-gray-600">
                <span id="health-dot" class="w-2.5 h-2.5 rounded-full bg-gray-400 animate-pulse"></span>
                <span id="health-text">Checking API Health...</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8">
        
        <!-- Search Card -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-gray-100">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                Search Database
            </h2>
            <form id="search-form" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div class="md:col-span-2">
                    <label for="mobile-input" class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                    <input type="text" id="mobile-input" placeholder="e.g. 9876543210 or enter query" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <div>
                    <button type="submit" id="search-btn"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow transition flex items-center justify-center">
                        <span>Search</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-md font-semibold text-gray-700">Results</h3>
                <span id="result-count" class="text-xs text-gray-500 bg-gray-200 px-2.5 py-1 rounded-full">0 found</span>
            </div>

            <!-- Loading Spinner -->
            <div id="loading" class="hidden flex justify-center items-center py-12">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
            </div>

            <!-- Error Message Box -->
            <div id="error-box" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-r-lg mb-4" role="alert">
                <p id="error-message" class="text-sm"></p>
            </div>

            <!-- Cards Grid -->
            <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- User cards will be dynamically injected here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="text-center py-12 bg-white rounded-xl border border-dashed border-gray-300">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900">No records queried yet</h3>
                <p class="mt-1 text-sm text-gray-500">Enter a mobile number above to fetch details.</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 mt-auto">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs text-gray-500">
            Connected to API: <a href="https://gp-work.onrender.com" target="_blank" class="text-blue-600 hover:underline">https://gp-work.onrender.com</a>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const API_BASE = 'https://gp-work.onrender.com';

        // Elements
        const healthDot = document.getElementById('health-dot');
        const healthText = document.getElementById('health-text');
        const healthStatusDiv = document.getElementById('health-status');
        const searchForm = document.getElementById('search-form');
        const mobileInput = document.getElementById('mobile-input');
        const searchBtn = document.getElementById('search-btn');
        const loadingSpinner = document.getElementById('loading');
        const errorBox = document.getElementById('error-box');
        const errorMessage = document.getElementById('error-message');
        const resultsContainer = document.getElementById('results-container');
        const emptyState = document.getElementById('empty-state');
        const resultCount = document.getElementById('result-count');

        // Check Health on Load
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    healthDot.className = 'w-2.5 h-2.5 rounded-full bg-green-500';
                    healthText.textContent = 'API Online';
                    healthStatusDiv.className = 'flex items-center space-x-2 bg-green-50 px-3 py-1.5 rounded-full text-xs font-medium text-green-700 border border-green-200';
                } else {
                    throw new Error('Unhealthy status');
                }
            } catch (error) {
                healthDot.className = 'w-2.5 h-2.5 rounded-full bg-red-500';
                healthText.textContent = 'API Offline / Unreachable';
                healthStatusDiv.className = 'flex items-center space-x-2 bg-red-50 px-3 py-1.5 rounded-full text-xs font-medium text-red-700 border border-red-200';
            }
        }

        checkHealth();

        // Handle Search Form Submit
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const queryValue = mobileInput.value.trim();

            if (!queryValue) {
                showError('Please enter a mobile number or search query.');
                return;
            }

            hideError();
            emptyState.classList.add('hidden');
            resultsContainer.innerHTML = '';
            loadingSpinner.classList.remove('hidden');
            searchBtn.disabled = true;

            try {
                // Call GET /search?mobile=...
                const url = `${API_BASE}/search?mobile=${encodeURIComponent(queryValue)}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Server returned error status: ${response.status}`);
                }

                const data = await response.json();
                
                // Handle different response formats (array of objects or single object/wrapped results)
                let records = [];
                if (Array.isArray(data)) {
                    records = data;
                } else if (data && typeof data === 'object') {
                    // Check if there is an inner array (e.g. data.results or data.data)
                    const potentialArrayKey = Object.keys(data).find(k => Array.isArray(data[k]));
                    if (potentialArrayKey) {
                        records = data[potentialArrayKey];
                    } else {
                        records = [data]; // Single object result
                    }
                }

                renderResults(records);

            } catch (err) {
                showError(`Failed to fetch details: ${err.message}`);
                resultCount.textContent = '0 found';
                emptyState.classList.remove('hidden');
            } finally {
                loadingSpinner.classList.add('hidden');
                searchBtn.disabled = false;
            }
        });

        function renderResults(records) {
            resultsContainer.innerHTML = '';
            if (!records || records.length === 0) {
                resultCount.textContent = '0 found';
                emptyState.classList.remove('hidden');
                return;
            }

            resultCount.textContent = `${records.length} found`;

            records.forEach(record => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-md border border-gray-200 p-5 flex flex-col justify-between hover:shadow-lg transition';

                let fieldsHtml = '';
                for (const [key, value] of Object.entries(record)) {
                    fieldsHtml += `
                        <div class="flex justify-between py-1.5 border-b border-gray-100 text-sm">
                            <span class="font-medium text-gray-500 capitalize">${key.replace(/_/g, ' ')}</span>
                            <span class="text-gray-900 font-semibold text-right break-all ml-2">${value !== null ? value : '<span class="text-gray-400 italic">N/A</span>'}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-200">
                            <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-1 rounded">User Record</span>
                        </div>
                        <div class="space-y-1">
                            ${fieldsHtml}
                        </div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorBox.classList.remove('hidden');
        }

        function hideError() {
            errorBox.classList.add('hidden');
        }
    </script>
</body>
</html>
